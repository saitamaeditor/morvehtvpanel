<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MorvehTV - Panel MovieEngine Pro</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #0f172a; color: #f8fafc; margin: 0; padding: 20px; }
        .container { max-width: 900px; margin: 0 auto; background: #1e293b; padding: 30px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); }
        h1, h2 { color: #38bdf8; }
        h1 { font-size: 24px; margin-bottom: 20px; }
        h2 { font-size: 18px; margin-top: 30px; border-bottom: 1px solid #334155; padding-bottom: 8px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 6px; font-weight: 600; color: #94a3b8; font-size: 13px; }
        input[type="text"], input[type="password"], textarea, select { width: 100%; padding: 12px; border: 1px solid #334155; background: #0f172a; color: #fff; border-radius: 6px; box-sizing: border-box; }
        textarea { resize: vertical; height: 120px; }
        button { background: #0284c7; color: white; border: none; padding: 12px 20px; border-radius: 6px; cursor: pointer; font-weight: bold; transition: background 0.2s; }
        button:hover { background: #0369a1; }
        .btn-success { background: #10b981; }
        .btn-success:hover { background: #059669; }
        .btn-imdb { background: #f59e0b; color: #000; }
        .btn-imdb:hover { background: #d97706; }
        .status-box { margin-top: 15px; padding: 12px; border-radius: 6px; display: none; font-size: 14px; }
        .success { background: #065f46; color: #d1fae5; }
        .error { background: #991b1b; color: #fee2e2; }
    </style>
</head>
<body>
    <div class="container">
        <h1>MorvehTV - Integración MovieEngine Pro</h1>
        
        <!-- Configuración de Conexión -->
        <div class="form-group">
            <label>URL DEL SITIO WORDPRESS</label>
            <input type="text" id="wp_url" value="https://morvehtv.es">
        </div>
        
        <div class="form-group">
            <label>USUARIO ADMINISTRADOR</label>
            <input type="text" id="wp_user" value="j81298647">
        </div>
        
        <div class="form-group">
            <label>CONTRASEÑA DE APLICACIÓN (APPLICATION PASSWORD)</label>
            <input type="password" id="wp_pass" value="SYuQHcpIdPbKqm1s43TBLdyZ">
        </div>
        
        <button id="test_conn">Probar Conexión WP</button>
        <div id="status" class="status-box"></div>

        <!-- Importador IMDb -->
        <h2>1. Importar por IMDb (MovieEngine Pro)</h2>
        <div class="form-group">
            <label>ID O URL DE IMDb (Ej. tt1375666)</label>
            <input type="text" id="imdb_input" placeholder="https://www.imdb.com/title/tt1375666/ o solo tt1375666">
        </div>
        <button id="imdb_btn" class="btn-imdb">Cargar Datos de IMDb</button>
        <div id="imdb_status" class="status-box"></div>

        <!-- Publicador para MovieEngine Pro -->
        <h2>2. Publicar en MorvehTV</h2>
        <div class="form-group">
            <label>TIPO DE CONTENIDO (MOVIEENGINE PRO REST ENDPOINT)</label>
            <select id="post_type">
                <option value="movies">Película (Movies)</option>
                <option value="tvshows">Serie (TV Shows)</option>
                <option value="seasons">Temporada</option>
                <option value="episodes">Episodio</option>
            </select>
        </div>

        <div class="form-group">
            <label>TÍTULO</label>
            <input type="text" id="post_title" placeholder="Título de la película o serie">
        </div>
        
        <div class="form-group">
            <label>SINOPSIS / DESCRIPCIÓN (CASTELLANO)</label>
            <textarea id="post_content" placeholder="Sinopsis oficial..."></textarea>
        </div>

        <div class="form-group">
            <label>ID DE IMDb (CLAVE PARA MOVIEENGINE)</label>
            <input type="text" id="meta_imdb" placeholder="Ej. tt1375666">
        </div>

        <div class="form-group">
            <label>ESTADO</label>
            <select id="post_status">
                <option value="publish">Publicado</option>
                <option value="draft">Borrador</option>
            </select>
        </div>
        
        <button id="publish_btn" class="btn-success">Publicar en MovieEngine Pro</button>
        <div id="publish_status" class="status-box"></div>
    </div>

    <script>
        // 1. Probar Conexión
        document.getElementById('test_conn').addEventListener('click', async () => {
            const url = document.getElementById('wp_url').value.trim().replace(/\/+$/, '');
            const user = document.getElementById('wp_user').value.trim();
            const pass = document.getElementById('wp_pass').value.trim();
            const statusBox = document.getElementById('status');

            statusBox.style.display = 'block';
            statusBox.className = 'status-box';
            statusBox.innerText = 'Conectando con WordPress...';

            const credentials = btoa(`${user}:${pass}`);

            try {
                const response = await fetch(`${url}/wp-json/wp/v2/users/me`, {
                    method: 'GET',
                    headers: {
                        'Authorization': `Basic ${credentials}`,
                        'Content-Type': 'application/json'
                    }
                });

                if (response.ok) {
                    const data = await response.json();
                    statusBox.className = 'status-box success';
                    statusBox.innerText = `¡Conectado con éxito! Usuario autenticado: ${data.name || data.slug}`;
                } else {
                    const errData = await response.json().catch(() => ({}));
                    throw new Error(errData.message || `Error HTTP: ${response.status}`);
                }
            } catch (error) {
                statusBox.className = 'status-box error';
                statusBox.innerText = `No se pudo conectar con WordPress. Revisa tus credenciales. (${error.message})`;
            }
        });

        // 2. Simular carga de IMDb en Castellano
        document.getElementById('imdb_btn').addEventListener('click', () => {
            let imdbVal = document.getElementById('imdb_input').value.trim();
            const imdbStatus = document.getElementById('imdb_status');

            if (!imdbVal) {
                imdbStatus.style.display = 'block';
                imdbStatus.className = 'status-box error';
                imdbStatus.innerText = 'Introduce un ID o enlace de IMDb válido.';
                return;
            }

            const match = imdbVal.match(/tt\d+/);
            const imdbId = match ? match[0] : imdbVal;

            imdbStatus.style.display = 'block';
            imdbStatus.className = 'status-box success';
            imdbStatus.innerText = `Metadatos de IMDb (${imdbId}) obtenidos en Castellano para MovieEngine Pro.`;

            document.getElementById('post_title').value = `Título de Ejemplo (${imdbId}) Castellano`;
            document.getElementById('post_content').value = `Sinopsis detallada en castellano extraída de IMDb para MovieEngine Pro.`;
            document.getElementById('meta_imdb').value = imdbId;
        });

        // 3. Publicar contenido con sistema de reintentos inteligente
        document.getElementById('publish_btn').addEventListener('click', async () => {
            const url = document.getElementById('wp_url').value.trim().replace(/\/+$/, '');
            const user = document.getElementById('wp_user').value.trim();
            const pass = document.getElementById('wp_pass').value.trim();
            const postType = document.getElementById('post_type').value; // movies, tvshows, etc.
            const title = document.getElementById('post_title').value.trim();
            const content = document.getElementById('post_content').value.trim();
            const imdbId = document.getElementById('meta_imdb').value.trim();
            const status = document.getElementById('post_status').value;
            const pubStatus = document.getElementById('publish_status');

            if (!title || !content) {
                pubStatus.style.display = 'block';
                pubStatus.className = 'status-box error';
                pubStatus.innerText = 'Por favor, rellena el título y el contenido.';
                return;
            }

            pubStatus.style.display = 'block';
            pubStatus.className = 'status-box';
            pubStatus.innerText = 'Enviando contenido a MorvehTV...';

            const credentials = btoa(`${user}:${pass}`);

            try {
                // Intento 1: Publicar mediante posts estándar con metadatos integrados
                let response = await fetch(`${url}/wp-json/wp/v2/posts`, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Basic ${credentials}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        title: title,
                        content: content,
                        status: status,
                        meta: {
                            ids: imdbId,
                            imdb_id: imdbId,
                            meta_id: imdbId
                        }
                    })
                });

                if (response.ok) {
                    const data = await response.json();
                    pubStatus.className = 'status-box success';
                    pubStatus.innerText = `¡Publicado con éxito en MorvehTV! (ID del post: ${data.id})`;
                    document.getElementById('post_title').value = '';
                    document.getElementById('post_content').value = '';
                    document.getElementById('imdb_input').value = '';
                    document.getElementById('meta_imdb').value = '';
                } else {
                    // Intento 2: Usar la ruta específica del CPT del tema seleccionado
                    const fallbackResponse = await fetch(`${url}/wp-json/wp/v2/${postType}`, {
                        method: 'POST',
                        headers: {
                            'Authorization': `Basic ${credentials}`,
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({
                            title: title,
                            content: content,
                            status: status,
                            meta: {
                                ids: imdbId,
                                imdb_id: imdbId,
                                meta_id: imdbId
                            }
                        })
                    });

                    if (fallbackResponse.ok) {
                        const data = await fallbackResponse.json();
                        pubStatus.className = 'status-box success';
                        pubStatus.innerText = `¡Publicado en MovieEngine Pro (${postType})! (ID: ${data.id})`;
                        document.getElementById('post_title').value = '';
                        document.getElementById('post_content').value = '';
                        document.getElementById('imdb_input').value = '';
                        document.getElementById('meta_imdb').value = '';
                    } else {
                        const errData = await fallbackResponse.json().catch(() => ({}));
                        throw new Error(errData.message || `Error HTTP: ${fallbackResponse.status}`);
                    }
                }
            } catch (error) {
                pubStatus.className = 'status-box error';
                pubStatus.innerText = `Error al publicar: ${error.message}`;
            }
        });
    </script>
</body>
</html>
